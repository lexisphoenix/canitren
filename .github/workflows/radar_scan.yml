name: Radar Scanner (Cloud Automation)

on:
  schedule:
    # Run every 2 hours in GitHub Actions cloud
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface

permissions:
  contents: write

jobs:
  scan-corridors:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Radar Scanner with Headless Chromium
        run: |
          python backend/scripts/radar_scanner.py

      - name: Commit and push fresh radar feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/radar_feed.json
          if git diff --staged --quiet; then
            echo "No changes in radar feed."
          else
            git commit -m "chore(radar): auto-update live dog availability feed [skip ci]"
            git push
          fi
